# USB Wi-Fi support stack
CONFIG_WLAN=y
CONFIG_CFG80211=m
CONFIG_CFG80211_WEXT=y
CONFIG_MAC80211=m
CONFIG_RFKILL=m

# CCMP (AES-CCM) crypto — required by mac80211 for WPA2.
# Must be built-in because ARM64 CE CCM requires AES CE instructions
# which the RZ/G2UL (Cortex-A55) lacks, and the generic ccm.ko module
# was not pulled into the image by default.
CONFIG_CRYPTO_CCM=y
CONFIG_CRYPTO_CMAC=y

# Disable signed regulatory database requirement.
# The kernel's built-in signing keys do not match the upstream wireless-regdb
# signature, so `iw reg set AU` silently fails and all 5 GHz channels remain
# NO-IR (no initiate radiation), preventing AP beacon transmission.
# With this disabled, the wireless-regdb package's regulatory.db is accepted
# unsigned, enabling proper country-code configuration for AP mode.
#
# NOTE: REQUIRE_SIGNED_REGDB is only configurable when CERTIFICATION_ONUS=y
# (Kconfig: `bool "require regdb signature" if CFG80211_CERTIFICATION_ONUS`).
# Without it, REQUIRE_SIGNED_REGDB silently defaults to y regardless of the
# fragment. CERTIFICATION_ONUS requires CONFIG_EXPERT=y (already set in defconfig).
CONFIG_CFG80211_CERTIFICATION_ONUS=y
# CONFIG_CFG80211_REQUIRE_SIGNED_REGDB is not set

# Realtek vendor support
CONFIG_WLAN_VENDOR_REALTEK=y

# rtl8xxxu DISABLED — kernel 5.10 lacks 8188E chipset support.
# Its probe loads wrong firmware (rtl8192cufw_TMSC.bin), partially inits
# the USB device hardware, then fails at LLT table init.  This leaves the
# device in a corrupted state so r8188eu's ndo_open() hangs forever.
# CONFIG_RTL8XXXU is not set

# r8188eu staging driver DISABLED — hard-locks on WPA2 association in 5.10.
# Replaced by out-of-tree aircrack-ng/rtl8188eus (recipe: rtl8188eus_git.bb)
# which produces 8188eu.ko with working cfg80211/nl80211 interface.
# CONFIG_STAGING is not set
# CONFIG_R8188EU is not set
