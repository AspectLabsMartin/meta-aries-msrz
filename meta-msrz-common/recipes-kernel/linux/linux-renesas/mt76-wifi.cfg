# MediaTek MT76x2U (MT7612U) USB WiFi support
# Requires: wifi-usb.cfg (CFG80211, MAC80211, RFKILL base stack)
#
# Hardware: MediaTek MT7612U 802.11a/b/g/n/ac USB dongle
# USB ID:   0e8d:7612
# Driver:   mt76x2u (in-tree mt76 stack)
# Firmware: mt7662.bin, mt7662_rom_patch.bin
# Features: AP+STA concurrent mode (same channel)

CONFIG_WLAN_VENDOR_MEDIATEK=y
CONFIG_MT76_CORE=m
CONFIG_MT76_USB=m
CONFIG_MT76x02_LIB=m
CONFIG_MT76x02_USB=m
CONFIG_MT76x2_COMMON=m
CONFIG_MT76x2U=m
