# AE400 crash/hang forensics + auto-recovery hardening
# ---------------------------------------------------------------------------
# Problem: random, unattended full SOM lockups that leave NO trace. The stock
# msrz RT defconfig ships with NONE of the kernel lockup detectors and does not
# panic on oops, so a hang is completely silent — nothing is ever printed.
#
# Strategy (paired with an off-board serial-console logger): turn a silent hang
# into a LOUD kernel panic that prints a full backtrace to the serial console
# BEFORE rebooting. Because the console is captured on a separate host, the
# backtrace survives the reboot without needing pstore/ramoops. The panic then
# auto-reboots the board for recovery (belt-and-suspenders with the RWDT HW
# watchdog held by system-watchdog).
#
# NOTE: RZ/G2UL is a single Cortex-A55 core, so the buddy/NMI HARDLOCKUP
# detector cannot work (it needs a second CPU to observe a wedged one). We rely
# on the softlockup detector, the hung-task detector and the workqueue lockup
# detector, which all function on a single core.

# --- Lockup / hang detectors -------------------------------------------------
CONFIG_LOCKUP_DETECTOR=y
CONFIG_SOFTLOCKUP_DETECTOR=y
CONFIG_DETECT_HUNG_TASK=y
CONFIG_DEFAULT_HUNG_TASK_TIMEOUT=120
CONFIG_WQ_WATCHDOG=y

# --- Make a wedged CPU fatal so it panics (backtrace -> console -> reboot) ----
# softlockup = a CPU stuck in the kernel not scheduling for >~20s; this is the
# signature of the full lockup and has a very low false-positive rate, so we
# make it panic. hung-task (a single task in D-state too long) only PRINTS a
# backtrace by default here to avoid rebooting during legitimately long I/O;
# it can be promoted to panic at runtime via sysctl kernel.hung_task_panic=1.
CONFIG_BOOTPARAM_SOFTLOCKUP_PANIC=y

# --- Panic on any oops/BUG, then auto-reboot after 10s -----------------------
CONFIG_PANIC_ON_OOPS=y
CONFIG_PANIC_ON_OOPS_VALUE=1
CONFIG_PANIC_TIMEOUT=10

# --- Ensure the diagnostics actually reach the console at high verbosity -----
CONFIG_CONSOLE_LOGLEVEL_DEFAULT=8
CONFIG_CONSOLE_LOGLEVEL_QUIET=4
CONFIG_MESSAGE_LOGLEVEL_DEFAULT=7

# --- Magic SysRq fully enabled: lets us force task/lock backtraces over the
#     serial line during a partial hang (echo t/w/l > /proc/sysrq-trigger, or
#     the serial break sequence) ------------------------------------------------
CONFIG_MAGIC_SYSRQ=y
CONFIG_MAGIC_SYSRQ_DEFAULT_ENABLE=0x1

# --- RCU stall backtraces to console (diagnostic, non-fatal) -----------------
CONFIG_RCU_CPU_STALL_TIMEOUT=30
