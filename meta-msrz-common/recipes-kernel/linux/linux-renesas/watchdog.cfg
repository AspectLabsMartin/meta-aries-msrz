# Hardware watchdog (RZ/G2UL RWDT) for automatic lockup recovery.
# Exposes /dev/watchdog so the system-watchdog service can keep the SoC alive
# while userspace/kernel are healthy and let it reset the board on a hard hang.
# The Cortex-A55 watchdog node (wdt0) is enabled in aries/msrzg2ul.dtsi.
CONFIG_WATCHDOG=y
CONFIG_WATCHDOG_CORE=y
CONFIG_RENESAS_RZG2LWDT=y
