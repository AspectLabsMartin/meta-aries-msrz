# Disable PREEMPT_RT (standard low-latency preemption instead of full realtime).
# ---------------------------------------------------------------------------
# The AE400 offloads ALL hard real-time work to the DSPs, so the Linux side
# gains nothing from the PREEMPT_RT patch — it only pays its cost: a far more
# invasive, far less-tested kernel (sleeping spinlocks, threaded IRQs, priority
# inheritance, softirq-as-kthread) running the vendor's less-travelled rt23
# driver path. That is the prime suspect for the silent, IRQs-off hard lockups
# that reset the SOM ~every 10-12 h with no panic/backtrace.
#
# This fragment flips ONLY the preemption model on the SAME branch/SRCREV/DTS,
# so a soak result cleanly isolates PREEMPT_RT as the variable: if the box stops
# locking up, RT was the cause; if it still locks up, RT is ruled out.
# CONFIG_PREEMPT_RT is not set
CONFIG_PREEMPT=y
