# /etc/dnsmasq-ap0.conf — DHCP server for AE400 WiFi AP
# Bound to ap0 interface only; does not interfere with other interfaces.

interface=ap0
bind-interfaces
except-interface=lo

# DHCP range: 192.168.4.10 - 192.168.4.50, 12h lease
dhcp-range=192.168.4.10,192.168.4.50,255.255.255.0,12h

# Gateway = the AP interface address
dhcp-option=3,192.168.4.1

# DNS = the AP itself (dnsmasq will forward)
dhcp-option=6,192.168.4.1

# Captive portal URI (RFC 8910, DHCP option 114)
# Modern devices (Android 11+, iOS 14+) will auto-prompt to open this URL.
dhcp-option=114,http://192.168.4.1/

# Upstream DNS for general queries
no-resolv
server=8.8.8.8

# Captive portal detection — redirect OS probe domains to the AP so
# the device shows a "Sign in to network" notification.
address=/connectivitycheck.gstatic.com/192.168.4.1
address=/clients3.google.com/192.168.4.1
address=/captive.apple.com/192.168.4.1
address=/www.msftconnecttest.com/192.168.4.1
address=/nmcheck.gnome.org/192.168.4.1
address=/network-test.debian.org/192.168.4.1
address=/detectportal.firefox.com/192.168.4.1

# Logging
log-dhcp
log-facility=/var/log/dnsmasq-ap0.log
