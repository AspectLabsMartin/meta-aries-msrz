# /etc/hostapd-ap0.conf — AE400 WiFi Access Point
# Interface: wlan0 (primary interface on MT7612U)
#
# KNOWN ISSUES (kernel 5.10 in-tree mt76x2u driver):
#   - Virtual AP (ap0) beacon timer is broken (~0 TX beacons/5s)
#   - WPA2 handshake completes but client immediately disassociates
# WORKAROUND: Run AP on wlan0 (primary) in open mode.
# Re-enable WPA2 and virtual interface when driver is upgraded.

interface=wlan0
driver=nl80211
ssid=AE400
country_code=AU
ieee80211d=1

# 2.4 GHz band, channel 6 — most reliable on MT7612U USB with
# in-kernel 5.10 mt76 driver.
hw_mode=g
channel=6

# 802.11n support (always available on MT7612U)
ieee80211n=1
# HT capabilities for MT7612U 2T2R
ht_capab=[HT40+][SHORT-GI-20][SHORT-GI-40]
wmm_enabled=1

# 802.11ac — disabled for 2.4 GHz AP-only mode.
# Uncomment below if running 5 GHz (not recommended with in-kernel
# 5.10 driver due to NO-IR/TSF issues).
#ieee80211ac=1
#vht_oper_chwidth=0

# Authentication — OPEN (no WPA)
# WPA2-PSK causes immediate client disassociation on this driver.
# Re-enable when mt76x2u driver is upgraded.
auth_algs=1
#wpa=2
#wpa_passphrase=aspectlabs
#wpa_key_mgmt=WPA-PSK
#rsn_pairwise=CCMP

# Control interface for hostapd_cli diagnostics
ctrl_interface=/var/run/hostapd

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# Max stations
max_num_sta=8
