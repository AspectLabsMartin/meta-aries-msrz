# /etc/hostapd-ap0.conf — AE400 WiFi Access Point
# Interface: ap0 (virtual AP on MT7612U, same channel as STA)
#
# NOTE: 'channel' MUST match the STA association channel.
#       The init script reads the STA channel and patches this file
#       at runtime before starting hostapd.

interface=ap0
driver=nl80211
ssid=AE400
country_code=AU

# 2.4 GHz band (hw_mode=g). Change to 'a' for 5 GHz.
hw_mode=g
channel=6

# 802.11n support
ieee80211n=1
wmm_enabled=1

# Authentication — WPA2-PSK with CCMP
auth_algs=1
wpa=2
wpa_passphrase=aspectlabs
wpa_key_mgmt=WPA-PSK
rsn_pairwise=CCMP

# Logging
logger_syslog=-1
logger_syslog_level=2
logger_stdout=-1
logger_stdout_level=2

# Max stations
max_num_sta=8
