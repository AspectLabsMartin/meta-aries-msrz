# /etc/wpa_supplicant-wlan0.conf — AE400 WiFi STA (client)
# Interface: wlan0 (primary interface on MT7612U)
#
# Edit this file on the target to add/change WiFi network credentials.
# Multiple network blocks are supported for roaming.

ctrl_interface=/var/run/wpa_supplicant
update_config=1
country=AU

# Default development network — replace or extend for deployment.
network={
    ssid="Terrorbites"
    psk="smccs3152"
    key_mgmt=WPA-PSK
    priority=1
}

# Additional network example (uncomment and edit):
#network={
#    ssid="AnotherNetwork"
#    psk="password"
#    key_mgmt=WPA-PSK
#    priority=0
#}
