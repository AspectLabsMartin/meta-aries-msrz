# /etc/modprobe.d/mt76-usb.conf — MT7612U USB WiFi stability fix
#
# Disable USB scatter-gather (SG) for the mt76 USB transport layer.
# This prevents the well-documented MCU command timeout issue:
#   "mt76x02u_mcu_wait_resp failed with -110"
# which causes AP mode to hang under moderate traffic load.
#
# Reference: https://github.com/openwrt/mt76/issues/405
# Verified: OpenWRT users report 100+ days uptime with this fix.
options mt76-usb disable_usb_sg=1
